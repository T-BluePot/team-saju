<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팀사주 · 四柱로 보는 팀 궁합</title>

    <!--
      링크를 붙였을 때 뜨는 미리보기.

      공유 시트의 `링크 복사` 로 슬랙이나 카톡에 붙이면 이 값이 카드가 된다.
      없으면 주소만 덩그러니 남아서 뭘 보낸 건지가 안 보인다.

      주소가 `src/lib/config.ts` 의 `SITE_URL` 과 같은 값이어야 한다. 메타 태그는
      정적이라 상수를 못 읽는다. 도메인을 바꾸면 두 곳을 같이 고친다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="팀사주" />
    <meta property="og:title" content="팀사주 · 四柱로 보는 팀 궁합" />
    <meta property="og:description" content="우리 팀은 어떤 팀일까. 팀의 오행 조합과 비어 있는 기운을 살펴봅니다." />
    <meta property="og:url" content="https://team-saju.bluehotpot187.workers.dev" />
    <meta property="og:image" content="https://team-saju.bluehotpot187.workers.dev/og.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
